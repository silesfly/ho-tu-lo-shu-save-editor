<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>하락군협전 세이브 에디터 v1.0</title>
<style>
:root{
--paper:#f3ead6;--paper2:#ece0c6;--ink:#241c12;--ink2:#5a4a32;--rule:#b7a483;--accent:#8a2b1f;--accent2:#b8860b;--ok:#2e6b3a;--warn:#a5561b;--bubble:#fbf6e9;--shadow:0 1px 2px rgba(40,28,12,.18),0 6px 18px rgba(40,28,12,.08);--radius:6px;--tab-h:34px;
--bg:var(--paper);--fg:var(--ink);--muted:var(--ink2);--panel:var(--paper2);--line:var(--rule);--btn:#e4d6b5;--btn-fg:var(--ink);--btn-hover:#d9c79c;--chip:#efe3c4;--field:#fbf6e9;--overlay:rgba(36,28,18,.35)
}
[data-theme="dark"]{
--paper:#15120c;--paper2:#1c180f;--ink:#e8dcc0;--ink2:#a99a7c;--rule:#3a3020;--accent:#d8796b;--accent2:#e6c069;--ok:#6fbf7e;--warn:#e09a4f;--bubble:#241e13;--shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
--bg:var(--paper);--fg:var(--ink);--muted:var(--ink2);--panel:var(--paper2);--line:var(--rule);--btn:#2a2317;--btn-fg:var(--ink);--btn-hover:#352c1c;--chip:#2a2317;--field:#1f1a11;--overlay:rgba(0,0,0,.55)
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--paper:#15120c;--paper2:#1c180f;--ink:#e8dcc0;--ink2:#a99a7c;--rule:#3a3020;--accent:#d8796b;--accent2:#e6c069;--ok:#6fbf7e;--warn:#e09a4f;--bubble:#241e13;--shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
--bg:var(--paper);--fg:var(--ink);--muted:var(--ink2);--panel:var(--paper2);--line:var(--rule);--btn:#2a2317;--btn-fg:var(--ink);--btn-hover:#352c1c;--chip:#2a2317;--field:#1f1a11;--overlay:rgba(0,0,0,.55)
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;
background-image:radial-gradient(circle at 20% 10%,rgba(138,43,31,.04),transparent 40%),radial-gradient(circle at 80% 90%,rgba(184,134,11,.05),transparent 45%)}
.hidden{display:none !important}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;color:var(--fg)}
h2{font-size:14px;margin:0 0 8px;font-weight:700;color:var(--fg)}
h3{font-size:13px;margin:0 0 6px;font-weight:700;color:var(--fg)}
p,li{color:var(--fg)}
small{color:var(--muted)}
button,select,input[type=text],input[type=number],input[type=search],input[type=file]{font:inherit;color:var(--fg)}
button{background:var(--btn);color:var(--btn-fg);border:1px solid var(--line);border-radius:var(--radius);padding:5px 12px;cursor:pointer;transition:background .12s,border-color .12s;letter-spacing:.02em}
button:hover:not(:disabled){background:var(--btn-hover)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],select{background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:4px 8px;min-height:28px}
select{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;box-shadow:var(--shadow)}
.topbar .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1 1 100%}
.topbar .row:first-child{flex:0 1 auto}
.topbar .title-wrap{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);color:var(--muted);padding:2px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
#dirty-badge{background:var(--accent);color:#fff;border-color:transparent}
#status-msg{min-height:22px;color:var(--muted);font-size:13px;flex-basis:100%}
#status-msg.error{color:var(--warn)}
#status-msg.ok{color:var(--ok)}
#native-bar,#server-bar,#browser-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:var(--top-h,110px);z-index:10}
.tab-btn{background:transparent;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;padding:7px 14px;color:var(--muted);font-weight:600;letter-spacing:.02em;position:relative;top:1px}
.tab-btn[aria-selected="true"]{background:var(--panel);color:var(--fg);border-color:var(--line);border-bottom:1px solid var(--panel);box-shadow:0 -1px 2px rgba(0,0,0,.04)}
.tab-btn:hover:not([aria-selected="true"]){color:var(--fg);background:var(--chip)}
main{padding:16px;max-width:1280px;margin:0 auto}
.panel{display:none;animation:fade .15s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;color:var(--accent);font-size:13px;letter-spacing:.04em}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right;word-break:break-all}
#preset-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
#preset-grid button{text-align:left;padding:8px 10px}
#preset-grid button small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.field-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.field-row label{min-width:110px;color:var(--muted)}
.field-row input,.field-row select{flex:1 1 160px;max-width:280px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.toolbar input[type=search]{flex:1 1 200px;max-width:340px}
.toolbar select{max-width:240px}
.stack{display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
#stat-group-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#stat-group-bar button{padding:4px 10px;font-size:12px}
#stat-group-bar button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
#stats-grid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.stat-item{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:var(--radius);padding:5px 8px}
.stat-item .name{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
.stat-item input{width:76px;text-align:right;padding:2px 6px;min-height:24px}
.table-wrap{overflow:auto;max-height:min(60vh,520px);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overscroll-behavior:contain}
.inv-table,.atlas-table,.diff-table{width:100%;border-collapse:collapse;font-size:13px}
.inv-table th,.atlas-table th,.diff-table th{position:sticky;top:0;background:var(--panel);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700;color:var(--accent);z-index:2}
.inv-table td,.atlas-table td,.diff-table td{padding:5px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);vertical-align:middle}
.inv-table tr:nth-child(even) td,.atlas-table tr:nth-child(even) td,.diff-table tr:nth-child(even) td{background:color-mix(in srgb,var(--panel) 60%,var(--field) 40%)}
.inv-table td input[type=number]{width:64px;text-align:right;padding:2px 5px;min-height:24px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--fg)}
.chip.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:10px;text-align:center}
dialog#picker-dialog{border:1px solid var(--line);border-radius:8px;padding:0;width:min(560px,92vw);max-height:80vh;background:var(--panel);color:var(--fg);box-shadow:0 12px 40px rgba(0,0,0,.35);overscroll-behavior:contain}
dialog#picker-dialog::backdrop{background:var(--overlay)}
.dialog-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dialog-head h3{margin:0;flex:1 1 auto;color:var(--fg)}
.dialog-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:calc(80vh - 60px);overflow:auto;overscroll-behavior:contain}
#picker-list{list-style:none;margin:0;padding:0;overflow:auto;flex:1 1 auto;border:1px solid var(--line);border-radius:6px;background:var(--field);min-height:120px;max-height:56vh}
#picker-list li{padding:6px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:pointer}
#picker-list li:last-child{border-bottom:none}
#picker-list li:hover,#picker-list li[aria-selected="true"]{background:var(--chip)}
#picker-list li .sub{color:var(--muted);font-size:12px}
@media (max-width:720px){
.topbar{padding:8px 10px}
main{padding:10px}
.tabs{padding:8px 10px 0}
.tab-btn{padding:6px 10px;font-size:13px}
.field-row label{min-width:90px}
.inv-table td input[type=number]{width:56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="row">
    <div class="title-wrap">
      <h1>하락군협전 세이브 에디터 v1.0</h1>
      <span id="file-badge" class="badge">파일 미로드</span>
      <span id="dirty-badge" class="badge" hidden>미저장 변경</span>
    </div>
    <button id="btn-theme" type="button">테마 전환</button>
  </div>
  <div class="row" id="native-bar" hidden>
    <button id="btn-native-open" type="button">열기 (.save)</button>
    <button id="btn-native-save" type="button">저장 (백업 생성)</button>
    <button id="btn-native-save-copy" type="button">다른 이름으로 저장</button>
  </div>
  <div class="row" id="server-bar" hidden>
    <select id="server-save-select" aria-label="서버 세이브 선택"></select>
    <button id="btn-server-load" type="button">불러오기</button>
    <button id="btn-server-save" type="button">서버 저장</button>
  </div>
  <div class="row" id="browser-bar">
    <input type="file" id="file-input" accept=".save" class="hidden">
    <button id="btn-file-open" type="button">파일 열기 (.save)</button>
    <button id="btn-download-save" type="button" disabled>다운로드 (.save)</button>
    <button id="btn-load-demo" type="button">데모 세이브 체험</button>
  </div>
  <div class="row">
    <div id="status-msg" role="status" aria-live="polite">세이브 파일을 열어 주세요.</div>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="편집 탭">
  <button class="tab-btn" id="tab-btn-summary" role="tab" type="button" aria-selected="true" aria-controls="panel-summary">요약 · 프리셋 · 세계</button>
  <button class="tab-btn" id="tab-btn-chara" role="tab" type="button" aria-selected="false" aria-controls="panel-chara" tabindex="-1">인물 · 능력치</button>
  <button class="tab-btn" id="tab-btn-skills" role="tab" type="button" aria-selected="false" aria-controls="panel-skills" tabindex="-1">무공 · 감오</button>
  <button class="tab-btn" id="tab-btn-inventory" role="tab" type="button" aria-selected="false" aria-controls="panel-inventory" tabindex="-1">장비 · 소지품</button>
  <button class="tab-btn" id="tab-btn-party" role="tab" type="button" aria-selected="false" aria-controls="panel-party" tabindex="-1">동료 · 거점 · 칭호</button>
  <button class="tab-btn" id="tab-btn-atlas" role="tab" type="button" aria-selected="false" aria-controls="panel-atlas" tabindex="-1">코드 도감 · 검증 · 변경내역</button>
</nav>

<main>
  <section class="panel active" id="panel-summary" role="tabpanel" aria-labelledby="tab-btn-summary">
    <div class="grid" id="summary-cards"></div>
    <div class="box" style="margin-top:12px">
      <h2>빠른 프리셋</h2>
      <div id="preset-grid"></div>
    </div>
    <div class="box" style="margin-top:12px">
      <h2>세계 설정</h2>
      <form id="world-form" onsubmit="return false"></form>
    </div>
  </section>

  <section class="panel" id="panel-chara" role="tabpanel" aria-labelledby="tab-btn-chara" hidden>
    <div class="toolbar">
      <input type="search" id="chara-filter" placeholder="인물 검색" aria-label="인물 검색">
      <select id="chara-select" aria-label="인물 선택"><option value="">불러온 세이브 없음</option></select>
    </div>
    <div class="box" id="chara-basic-box"><div class="empty">인물을 선택해 주세요.</div></div>
    <div class="box" style="margin-top:12px">
      <h3>능력치</h3>
      <div id="stat-group-bar"></div>
      <div id="stats-grid"></div>
    </div>
  </section>

  <section class="panel" id="panel-skills" role="tabpanel" aria-labelledby="tab-btn-skills" hidden>
    <div class="stack">
      <div class="box" id="skills-box"><div class="empty">무공 정보가 없습니다.</div></div>
      <div class="box" id="talents-box"><div class="empty">감오 정보가 없습니다.</div></div>
    </div>
  </section>

  <section class="panel" id="panel-inventory" role="tabpanel" aria-labelledby="tab-btn-inventory" hidden>
    <div class="stack">
      <div class="box" id="equip-box"><div class="empty">장비 정보가 없습니다.</div></div>
      <div class="toolbar" id="inventory-toolbar">
        <input type="search" id="inv-filter" placeholder="소지품 검색" aria-label="소지품 검색">
        <select id="inv-category" aria-label="분류 선택"><option value="">전체 분류</option></select>
      </div>
      <div id="inventory-table-wrap" role="region" tabindex="0" aria-label="소지품 표"></div>
    </div>
  </section>

  <section class="panel" id="panel-party" role="tabpanel" aria-labelledby="tab-btn-party" hidden>
    <div class="stack">
      <div class="box" id="party-box"><div class="empty">동료 정보가 없습니다.</div></div>
      <div class="box" id="teleporters-box"><div class="empty">거점 정보가 없습니다.</div></div>
      <div class="box" id="nicknames-box"><div class="empty">칭호 정보가 없습니다.</div></div>
    </div>
  </section>

  <section class="panel" id="panel-atlas" role="tabpanel" aria-labelledby="tab-btn-atlas" hidden>
    <div class="stack">
      <div class="box" id="validation-box"><div class="empty">검증할 변경 사항이 없습니다.</div></div>
      <div class="box" id="diff-box"><div class="empty">변경 내역이 없습니다.</div></div>
      <div class="box" id="atlas-box"><div class="empty">도감 데이터가 없습니다.</div></div>
    </div>
  </section>
</main>

<dialog id="picker-dialog">
  <div class="dialog-head">
    <h3 id="picker-title">선택</h3>
    <button id="picker-close" type="button">닫기</button>
  </div>
  <div class="dialog-body">
    <input type="search" id="picker-search" placeholder="검색" aria-label="검색">
    <ul id="picker-list" role="listbox" aria-label="선택 목록"></ul>
  </div>
</dialog>

<script>(function (global, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else global.HtlsCodec = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const MAX_COMPRESSED_BYTES = 32 * 1024 * 1024;
  const MAX_UNCOMPRESSED_BYTES = 96 * 1024 * 1024;
  const MAX_DEPTH = 64;

  function toU8(v) {
    if (v instanceof Uint8Array) return v;
    if (v instanceof ArrayBuffer) return new Uint8Array(v);
    if (ArrayBuffer.isView(v)) return new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
    return Uint8Array.from(v || []);
  }

  function readU32BE(b, p) {
    return ((b[p] << 24) | (b[p + 1] << 16) | (b[p + 2] << 8) | b[p + 3]) >>> 0;
  }

  function readI32BE(b, p) {
    return (b[p] << 24) | (b[p + 1] << 16) | (b[p + 2] << 8) | b[p + 3];
  }

  function writeU32BE(out, p, v) {
    out[p] = (v >>> 24) & 255;
    out[p + 1] = (v >>> 16) & 255;
    out[p + 2] = (v >>> 8) & 255;
    out[p + 3] = v & 255;
  }

  function writeI32BE(out, p, v) {
    writeU32BE(out, p, v >>> 0);
  }

  function ensureOut(out, pos, need) {
    if (pos + need <= out.length) return out;
    let cap = out.length || 16;
    while (cap < pos + need) cap = Math.max(cap * 2, pos + need);
    const n = new Uint8Array(cap);
    n.set(out.subarray(0, pos));
    return n;
  }

  function lz4DecompressBlock(src, expectedSize) {
    src = toU8(src);
    if (src.length > MAX_COMPRESSED_BYTES) throw new Error('LZ4 compressed block too large');
    const expected = expectedSize >>> 0;
    if (expected > MAX_UNCOMPRESSED_BYTES) throw new Error('LZ4 uncompressed block too large');
    let out = new Uint8Array(expected || Math.max(16, src.length * 4));
    let ip = 0;
    let op = 0;

    function needOut(n) {
      if (op + n <= MAX_UNCOMPRESSED_BYTES && op + n <= out.length) return;
      let cap = out.length || 16;
      while (cap < op + n) cap = Math.max(cap * 2, op + n);
      if (cap > MAX_UNCOMPRESSED_BYTES) cap = MAX_UNCOMPRESSED_BYTES;
      if (cap < op + n) throw new Error('LZ4 output too large');
      const nout = new Uint8Array(cap);
      nout.set(out.subarray(0, op));
      out = nout;
    }

    while (ip < src.length) {
      const token = src[ip++];
      let litLen = token >>> 4;
      if (litLen === 15) {
        let v;
        do {
          if (ip >= src.length) throw new Error('Bad LZ4 literal length');
          v = src[ip++];
          litLen += v;
          if (litLen > MAX_UNCOMPRESSED_BYTES) throw new Error('LZ4 literal too large');

      if (ip + litLen > src.length) throw new Error('Bad LZ4 literal');
      needOut(litLen);
      out.set(src.subarray(ip, ip + litLen), op);
      ip += litLen;
      op += litLen;

      if (ip >= src.length) break;
      if (ip + 2 > src.length) throw new Error('Bad LZ4 offset');
      const offset = src[ip] | (src[ip + 1] << 8);
      ip += 2;
      if (offset === 0 || offset > op) throw new Error('Bad LZ4 offset');

      let matchLen = token & 15;
      if (matchLen === 15) {
        let v;
        do {
          if (ip >= src.length) throw new Error('Bad LZ4 match length');
          v = src[ip++];
          matchLen += v;
          if (matchLen > MAX_UNCOMPRESSED_BYTES) throw new Error('LZ4 match too large');
        } while (v === 255);
      }
      matchLen += 4;
      needOut(matchLen);
      let mp = op - offset;
      for (let i = 0; i < matchLen; i++) out[op++] = out[mp++];
    }

    return out.slice(0, op);

  function lz4CompressBlock(src) {
    src = toU8(src);
    const n = src.length;

    "it31002": {
      "category": "내공",
      "categoryCode": 307,
      "description": "청채 묘족 진채의 성물이다. 각종 묘강 독물의 제련 방법이 기록되어 있을 뿐 아니라, 듣기만 해도 두려움을 자아내는 절학 혈고신장과 고혹독인의 법이 함께 담겨 있다. 혈고는 사람의 피를 즐겨 먹으며 일단 풀려나면 중고자의 일곱 구멍으로 필사적으로 파고들어 내부에서부터 피해자를 잠식해 버린다. 한편 독인법은 환혹고로 오랜 세월 중고자의 심신을 마비시키고 그 몸을 둥지로 삼아 더 많은 고충을 길러내는 사악한 술법이다.",

    "it31003": {

  HtlsSession.prototype.addInventoryItem = function (cid, itemId, count) {

    if (!Array.isArray(ch.Inventory)) ch.Inventory = [];

    var list = normalizeInventoryNoList(getGameField(this.parsed, 'inventoryNoList') || []);
    var isEquipment = /^eq/.test(itemId);

    if (isEquipment) {
      var nextNo = maxInventoryNo(list) + 1;
      list.push(nextNo);
      setGameField(this.parsed, 'inventoryNoList', list);
      this._markGameField('inventoryNoList');
      var item = makeItem(itemId, count, 'InvNo' + nextNo);
      ch.Inventory.push(item);
      this._markTouched(cid);
      return item;
    }

    for (var i = 0; i < ch.Inventory.length; i++) {
      var existing = ch.Inventory[i];
      if (existing && existing.ItemId === itemId && existing.Id === null) {
        existing.Count = toFiniteInt(existing.Count, 0) + count;
        this._markTouched(cid);
        return existing;
      }
    }

    var newItem = makeItem(itemId, count, null);
    ch.Inventory.push(newItem);
    this._markTouched(cid);
    return newItem;
  };

  HtlsSession.prototype.computeDiff = function () {
    var diff = {
      changed: false,
      header: {},
      gameFields: {},
      characters: {}
    };

    var currentHeader = cloneValue(this.parsed.header || {});
    var headerKeys = {};
    var i;
    var baseHeaderKeys = Object.keys(this._baselineHeader || {});
    for (i = 0; i < baseHeaderKeys.length; i++) headerKeys[baseHeaderKeys[i]] = true;
    var curHeaderKeys = Object.keys(currentHeader);
    for (i = 0; i < curHeaderKeys.length; i++) headerKeys[curHeaderKeys[i]] = true;

    var hk = Object.keys(headerKeys);
    for (i = 0; i < hk.length; i++) {
      var hKey = hk[i];
      if (!sameValue(this._baselineHeader[hKey], currentHeader[hKey])) {
        diff.header[hKey] = {
          before: cloneValue(this._baselineHeader[hKey]),
          after: cloneValue(currentHeader[hKey])
        };
        diff.changed = true;
      }
    }

    for (i = 0; i < GAME_FIELD_KEYS.length; i++) {
      var gKey = GAME_FIELD_KEYS[i];
      var before = this._baselineGameFields[gKey];
      var after = getGameField(this.parsed, gKey);
      if (!sameValue(before, after)) {
        diff.gameFields[gKey] = {
          before: cloneValue(before),
          after: cloneValue(after)
        };
        diff.changed = true;
      }
    }

    var baseCids = Object.keys(this._baselineChars);
    for (i = 0; i < baseCids.length; i++) cids[baseCids[i]] = true;
    var touchedCids = Object.keys(this._touchedSet);
    for (i = 0; i < touchedCids.length; i++) cids[touchedCids[i]] = true;
    var cacheCids = Object.keys(this._charCache);
    for (i = 0; i < cacheCids.length; i++) cids[cacheCids[i]] = true;

    var cidKeys = Object.keys(cids);
    for (i = 0; i < cidKeys.length; i++) {
      var cid = cidKeys[i];
      var baseChar = this._baselineChars[cid];
      var curChar = this._charCache[cid];
      if (!baseChar && curChar) {

      if (!sameValue(baseChar, curChar)) {

          before: cloneValue(baseChar),
          after: cloneValue(curChar)

        diff.changed = true;
      }
    }

    return diff;

          var mhp = player.Data.MaxHP && player.Data.MaxHP.Base ? Math.max(99999, player.Data.MaxHP.Base) : 99999;
          var mmp = player.Data.MaxMP && player.Data.MaxMP.Base ? Math.max(50000, player.Data.MaxMP.Base) : 50000;
          session.setCharacterStat('Player', 'MaxHP', mhp);
          session.setCharacterStat('Player', 'HP', mhp);
          session.setCharacterStat('Player', 'MaxMP', mmp);
          session.setCharacterStat('Player', 'MP', mmp);
        }
        break;

      case 'hero_max_stats': {
        var maxKeys = ['HP','MaxHP','MP','MaxMP','RecoverAP','Speed','Physique','Intelligence','ZOC','Fight','Sword','Blade','Spear','Arrow','Short','Doctor','Poison','Neigong','Qinggong','HurbKnowledge','MineralKnowledge','StealKnowledge','BusinessKnowledge'];
        for (var k = 0; k < maxKeys.length; k++) {
          var sk = maxKeys[k];
          var val = (sk === 'HP' || sk === 'MaxHP') ? 99999 : (sk === 'MP' || sk === 'MaxMP') ? 50000 : (sk === 'RecoverAP') ? 10 : (sk === 'ZOC') ? 100 : 500;
          session.setCharacterStat('Player', sk, val);
        }
        for (var s = 0; s < STATUS_KEYS.length; s++) {
          session.setCharacterStat('Player', STATUS_KEYS[s], 0);
        }
        break;
      }

      case 'hero_all_talents': {
        var allTalents = Catalog && Catalog.talents ? Object.keys(Catalog.talents) : ['0_TalentNode000'];
        var curPts = player && player.TalentData ? toFiniteInt(player.TalentData.NewPoint, 0) : 0;
        session.setTalentNodes('Player', allTalents, curPts + 200);
        break;
      }

      case 'party_heal_cleanse': {
        var mates = (session.parsed && getGameField(session.parsed, 'Teammates')) || ['Player'];
        if (!Array.isArray(mates) || mates.length === 0) mates = ['Player'];
        for (var m = 0; m < mates.length; m++) {
          var cid = String(mates[m]);
          var ch = session.getCharacter(cid);
          if (!ch) continue;
          var chMhp = ch.Data && ch.Data.MaxHP ? toFiniteInt(ch.Data.MaxHP.Base, 1000) : 1000;
          var chMmp = ch.Data && ch.Data.MaxMP ? toFiniteInt(ch.Data.MaxMP.Base, 500) : 500;
          session.setCharacterStat(cid, 'HP', Math.max(1000, chMhp));
          session.setCharacterStat(cid, 'MP', Math.max(500, chMmp));
          for (var z = 0; z < STATUS_KEYS.length; z++) {
            session.setCharacterStat(cid, STATUS_KEYS[z], 0);
          }
        }
        break;
      }

      case 'unlock_teleporters':
        session.setWorldSettings({ unlockAllTeleporters: true, unlockAllNicknames: true });
        break;

      case 'hero_master_skills': {
        var st = player && player.SkillTree && player.SkillTree.LearnedSkill ? player.SkillTree.LearnedSkill : {};
        var skIds = Object.keys(st);
        for (var x = 0; x < skIds.length; x++) {
          var existing = st[skIds[x]] || {};
          var mexp = toFiniteInt(existing.MaxExp, 2000000) || 2000000;
          session.setSkillMastery('Player', skIds[x], {
            learned: true,
            isExpert: true,
            currentExp: mexp,
            maxExp: mexp
          });
        }
        break;
      }
    }

    return preset;
  }

  HtlsSession.prototype.applyPreset = function (presetId) {
    return applyPreset(this, presetId);
  };

  function createSession(bytes, name) {
    return new HtlsSession(bytes, name);
  }

  function createDemoSave() {
    return makeDemoSave();
  }

  var api = {
    HtlsSession: HtlsSession,
    createSession: createSession,
    PRESETS: PRESETS,
    applyPreset: function (session, presetId) {
      return applyPreset(session, presetId);
    },
    createDemoSave: createDemoSave
  };

  return api;
});
</script>
<script>'use strict';
(function () {
  const D = document;
  const $ = (id) => D.getElementById(id);
  const Core = window.HtlsEditorCore;
  const Cat = window.HtlsCatalog || {};
  const state = {
    session: null,
    fileName: '저장파일.save',
    cid: null,
    filter: '',
    tab: 'summary',
    picker: null,
    serverToken: '',
    serverSaves: [],
    nativeReady: false,
    dirty: false
  };

  const tabList = [
    ['summary', 'tab-btn-summary', 'panel-summary'],
    ['chara', 'tab-btn-chara', 'panel-chara'],
    ['skills', 'tab-btn-skills', 'panel-skills'],
    ['inventory', 'tab-btn-inventory', 'panel-inventory'],
    ['party', 'tab-btn-party', 'panel-party'],
    ['atlas', 'tab-btn-atlas', 'panel-atlas']
  ];

  function el(tag, text, cls) {
    const n = D.createElement(tag);
    if (text !== undefined && text !== null) n.textContent = String(text);
    if (cls) n.className = cls;
    return n;
  }
  function clear(n) { while (n && n.firstChild) n.removeChild(n.firstChild); return n; }
  function status(msg, bad) {
    const n = $('status-msg');
    if (!n) return;
    n.textContent = msg || '';
    n.className = bad ? 'error' : 'ok';
  }
  function setFile(name) {
    state.fileName = name || '저장파일.save';
    const b = $('file-badge');
    if (b) b.textContent = state.fileName;
    markDirty(false);
  }
  function markDirty(v) {
    state.dirty = !!v;
    const b = $('dirty-badge');
    if (b) {
      b.hidden = !state.dirty;
      b.textContent = state.dirty ? '미저장 변경' : '';
    }
  }
  function opt(text, value, selected) {
    const o = el('option', text);
    o.value = value === undefined || value === null ? '' : String(value);
    o.selected = !!selected;
    return o;
  }
  function button(text, fn, cls) {
    const b = el('button', text, cls || '');
    b.type = 'button';
    b.addEventListener('click', fn);
    return b;
  }
  function field(label, input) {
    const w = el('label', null, 'field');
    w.appendChild(el('span', label, 'field-label'));
    w.appendChild(input);
    return w;
  }
  function numInput(value, min, max, step) {
    const i = el('input');
    i.type = 'number';
    if (min !== undefined) i.min = String(min);
    if (max !== undefined) i.max = String(max);
    i.step = String(step || 1);
    i.value = value === undefined || value === null ? '' : String(value);
    return i;
  }
  function textInput(value, placeholder) {
    const i = el('input');
    i.type = 'text';
    i.value = value === undefined || value === null ? '' : String(value);
    if (placeholder) i.placeholder = placeholder;
    return i;
  }
  function selectInput(items, value, emptyText) {
    const s = el('select');
    if (emptyText !== undefined) s.appendChild(opt(emptyText, '', value === '' || value === null || value === undefined));
    (items || []).forEach((it) => {
      const id = it && (it.id !== undefined ? it.id : it.value);
      const name = it && (it.name !== undefined ? it.name : it.label);
      s.appendChild(opt(name !== undefined ? name : id, id, String(id) === String(value)));
    });
    return s;
  }
  function normalizeList(v) {
    if (!v) return [];
    if (Array.isArray(v)) return v;
    if (typeof v === 'object') {
      return Object.keys(v).map((k) => {
        const entry = v[k];
        if (entry && typeof entry === 'object') {
          const text = entry.name || entry.label || entry.id || k;
          return Object.assign({}, entry, { id: k, name: String(text), label: String(text) });
        }
        return { id: k, name: entry, label: entry };
      });
    }
    return [];
  }
  function codeLabel(map, id) {
    if (!map) return id === null || id === undefined ? '' : String(id);
    if (Array.isArray(map)) {
      const f = map.find((x) => String(x.id !== undefined ? x.id : x.value) === String(id));
      return f ? (f.name || f.label || f.id) : String(id);
    }
    if (typeof map === 'object' && map[id] !== undefined) {
      const v = map[id];
      return typeof v === 'object' ? (v.name || v.label || id) : v;
    }
    return id === null || id === undefined ? '' : String(id);
  }
  function hasSession() {
    if (!state.session) {
      status('먼저 저장파일을 열어 주세요.', true);
      return false;
    }
    return true;
  }
  function refreshAll() {
    renderSummary();
    renderCharacters();
    renderCharacterDetail();
    renderSkillsTalents();
    renderInventory();
    renderParty();
    renderAtlas();
  }
  function applySession(session, name) {
    state.session = session;
    state.cid = null;
    const list = session.getCharacterList ? session.getCharacterList() : [];
    const player = list.find((x) => x.isPlayer) || list[0];
    state.cid = player ? player.id : null;
    setFile(name || state.fileName);
    const dl = $('btn-download-save');
    if (dl) dl.disabled = false;
    refreshAll();
    status('저장파일을 열었습니다.');
  }

  function u8ToB64(u8) {
    let s = '';
    const chunk = 0x8000;
    for (let i = 0; i < u8.length; i += chunk) {
      s += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
    }
    return btoa(s);
  }
  function b64ToU8(s) {
    const bin = atob(s || '');
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  function downloadU8(u8, name) {
    const blob = new Blob([u8], { type: 'application/octet-stream' });
    const a = el('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = name || state.fileName || '저장파일.save';
    D.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 800);
  }
  function saveBytes() {
    if (!hasSession()) return null;
    const u8 = state.session.syncHeaderAndSave();
    markDirty(false);
    return u8;
  }
  function openBytes(u8, name) {
    if (!Core || !Core.createSession) {
      status('편집기 핵심 모듈을 찾지 못했습니다.', true);
      return false;
    }
    try {
      applySession(Core.createSession(u8, name), name);
      return true;
    } catch (e) {
      status('저장파일을 여는 중 오류가 발생했습니다.', true);
      return false;
    }
  }

  function setupTabs() {
    const tabs = tabList.map((x) => $(x[1])).filter(Boolean);
    tabs.forEach((btn, idx) => {
      btn.addEventListener('click', () => activateTab(tabList[idx][0], false));
      btn.addEventListener('keydown', (ev) => {
        let next = -1;
        if (ev.key === 'ArrowRight') next = (idx + 1) % tabs.length;
        else if (ev.key === 'ArrowLeft') next = (idx + tabs.length - 1) % tabs.length;
        else if (ev.key === 'Home') next = 0;
        else if (ev.key === 'End') next = tabs.length - 1;
        if (next >= 0) {
          ev.preventDefault();
          activateTab(tabList[next][0], true);
          tabs[next].focus();
        }
      });
    });
    activateTab('summary', false);
  }
  function activateTab(name, focus) {
    const found = tabList.find((x) => x[0] === name) || tabList[0];
    state.tab = found[0];
    tabList.forEach((x) => {
      const b = $(x[1]);
      const p = $(x[2]);
      const on = x[0] === found[0];
      if (b) {
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        b.className = on ? 'tab-btn active' : 'tab-btn';
      }
      if (p) {
        p.hidden = !on;
        p.classList.toggle('active', on);
      }
    });
  }

  function renderSummary() {
    const cards = clear($('summary-cards'));
    const grid = clear($('preset-grid'));
    const form = clear($('world-form'));
    if (!cards || !grid || !form) return;
    const s = state.session;
    if (!s) {
      cards.appendChild(el('p', '열린 저장파일이 없습니다.', 'empty'));
      return;
    }
    const h = s.parsed.header || {};
    const gf = (s._gameFields ? s._gameFields() : s.gameFields) || {};
    let ver = h.version !== undefined ? h.version : h.saveVersion;
    if (s.parsed && s.parsed.magic) {
      try {
        ver = s.parsed.magic instanceof Uint8Array
          ? new TextDecoder().decode(s.parsed.magic)
          : String(s.parsed.magic);
      } catch (e) {}
    }
    const add = (k, v) => {
      const c = el('div', null, 'card');
      c.appendChild(el('span', k, 'card-key'));
      c.appendChild(el('strong', v === undefined || v === null || v === '' ? '-' : v, 'card-value'));
      cards.appendChild(c);
    };
    add('파일', state.fileName);
    add('버전', ver);
    add('캐릭터 수', (s.getCharacterList ? s.getCharacterList().length : 0));
    add('난이도', codeLabel(Cat.difficulties, gf.Difficulty));
    add('경과 일수', gf.DaysFromBeginning);
    add('숙련 경험 배율', gf.SkillExpDistributionRate);
    add('동료 수', Array.isArray(gf.Teammates) ? gf.Teammates.length : 0);
    add('순간이동 해금', Array.isArray(gf.AvailableTeleporters) ? gf.AvailableTeleporters.length : 0);
    add('별명 해금', Array.isArray(gf.AvailableNicknames) ? gf.AvailableNicknames.length : 0);

    const presets = Core && Core.PRESETS ? Core.PRESETS : [];
    if (!presets.length) grid.appendChild(el('p', '사용 가능한 프리셋이 없습니다.', 'empty'));
    presets.forEach((p) => {
      const c = el('div', null, 'preset-card');
      c.appendChild(el('strong', p.name || p.id));
      c.appendChild(el('p', p.description || '', 'muted'));
      c.appendChild(button('적용', () => {
        try {
          Core.applyPreset(state.session, p.id);
          markDirty(true);
          refreshAll();
          status('프리셋을 적용했습니다.');
        } catch (e) {
          status('프리셋 적용 중 오류가 발생했습니다.', true);
        }
      }, 'primary'));
      grid.appendChild(c);
    });

    const diff = normalizeList(Cat.difficulties).length ? Cat.difficulties : [
      { id: 0, name: '보통' }, { id: 1, name: '어려움' }, { id: 2, name: '매우 어려움' }
    ];
    const dSel = selectInput(normalizeList(diff), gf.Difficulty);
    const days = numInput(gf.DaysFromBeginning, 0);
    const rate = numInput(gf.SkillExpDistributionRate, 0, undefined, 0.1);
    const uT = el('input'); uT.type = 'checkbox'; uT.checked = !!(gf.AvailableTeleporters && gf.AvailableTeleporters.length);
    const uN = el('input'); uN.type = 'checkbox'; uN.checked = !!(gf.AvailableNicknames && gf.AvailableNicknames.length);
    form.appendChild(field('난이도', dSel));
    form.appendChild(field('경과 일수', days));
    form.appendChild(field('숙련 경험 배율', rate));
    form.appendChild(field('순간이동 모두 해금', uT));
    form.appendChild(field('별명 모두 해금', uN));

          daysFromBeginning: Number(days.value),
          skillExpRate: Number(rate.value),
          unlockAllTeleporters: uT.checked,
          unlockAllNicknames: uN.checked
        });
        markDirty(true);
        renderSummary();
        status('세계 설정을 저장했습니다.');
      } catch (e) {
        status('세계 설정 저장 중 오류가 발생했습니다.', true);
      }
    }, 'primary'));
  }

  function renderCharacters() {
    const filter = $('chara-filter');
    const sel = $('chara-select');
    const box = clear($('chara-basic-box'));
    const bar = clear($('stat-group-bar'));
    const grid = clear($('stats-grid'));
    if (!sel) return;
    const s = state.session;
    clear(sel);
    if (!s) {
      sel.appendChild(opt('열린 저장파일 없음', ''));
      if (box) box.appendChild(el('p', '캐릭터가 없습니다.', 'empty'));
      return;
    }
    const list = s.getCharacterList();
    const q = (filter ? filter.value : '').trim().toLowerCase();
    const shown = list.filter((c) => !q || String(c.name || '').toLowerCase().includes(q));
    shown.forEach((c) => {
      const isMate = !!(c.isTeammate || c.inParty);
      const label = (c.isPlayer ? '[플레이어] ' : '') + (c.name || c.id) + (isMate ? ' • 동료' : '');
      sel.appendChild(opt(label, c.id, String(c.id) === String(state.cid)));
    });
    if (!shown.length) {
      sel.appendChild(opt('검색 결과 없음', ''));
      return;
    }
    if (!shown.some((c) => String(c.id) === String(state.cid))) state.cid = shown[0].id;
    sel.value = String(state.cid);
    if (sel.dataset.bound !== '1') {
      sel.dataset.bound = '1';
      sel.addEventListener('change', () => {
        state.cid = isNaN(Number(sel.value)) ? sel.value : Number(sel.value);

        renderSkillsTalents();
        renderInventory();
        renderParty();
      });
    }
    if (filter && filter.dataset.bound !== '1') {
      filter.dataset.bound = '1';
      filter.addEventListener('input', () => renderCharacters());
    }
    if (bar && grid) {
      const d = s.getCharacterDetail(state.cid);
      if (d && d.stats) {
        const groups = [];
        d.stats.forEach((st) => { if (groups.indexOf(st.group) < 0) groups.push(st.group); });
        groups.forEach((g) => bar.appendChild(el('span', g || '기본', 'chip')));
      }
    }
    if (box) {
      if (!sel.value && !list.length) box.appendChild(el('p', '캐릭터가 없습니다.', 'empty'));
    }
  }

  function renderCharacterDetail() {
    const box = clear($('chara-basic-box'));
    const grid = clear($('stats-grid'));
    if (!box || !grid) return;
    if (!state.session || state.cid === null) {
      box.appendChild(el('p', '캐릭터를 선택해 주세요.', 'empty'));
      return;
    }
    const d = state.session.getCharacterDetail(state.cid);
    if (!d) {
      box.appendChild(el('p', '캐릭터 정보를 읽지 못했습니다.', 'empty'));
      return;
    }
    const surnames = textInput(d.name ? '' : '');
    surnames.placeholder = '성';
    const names = textInput(d.name || '');
    const level = numInput(d.level, 1, d.maxLevel || undefined);
    const exp = numInput(d.exp, 0, d.maxExp || undefined);
    const tp = numInput(d.talentPoint, 0);
    const nickname = selectInput(normalizeList(Cat.nicknames), d.nicknameId, '없음');
    const nei = selectInput(normalizeList(Cat.skills), d.currentNeiGongId, '없음');
    const qing = selectInput(normalizeList(Cat.skills), d.currentQingGongId, '없음');
    const tree = selectInput(normalizeList(Cat.talentTrees), d.currentSkillTreeId, '없음');
    box.appendChild(field('이름', names));
    box.appendChild(field('성', surnames));
    box.appendChild(field('레벨', level));
    box.appendChild(field('경험치', exp));
    box.appendChild(field('특성 점수', tp));
    box.appendChild(field('별명', nickname));
    box.appendChild(field('내공', nei));
    box.appendChild(field('경공', qing));
    box.appendChild(field('특성 계통', tree));
    box.appendChild(button('기본 정보 저장', () => {
      try {
        state.session.setCharacterBasics(state.cid, {
          surname: surnames.value,
          name: names.value,
          level: Number(level.value),
          exp: Number(exp.value),
          talentPoint: Number(tp.value),
          nicknameId: nickname.value === '' ? null : Number(nickname.value),
          currentNeiGongId: nei.value === '' ? null : Number(nei.value),
          currentQingGongId: qing.value === '' ? null : Number(qing.value),
          currentSkillTreeId: tree.value === '' ? null : Number(tree.value)
        });
        markDirty(true);
        renderCharacters();
        renderCharacterDetail();
        status('기본 정보를 저장했습니다.');
      } catch (e) {
        status('기본 정보 저장 중 오류가 발생했습니다.', true);
      }
    }, 'primary'));

    (d.stats || []).forEach((st) => {
      const w = el('div', null, 'stat-item');

      const inp = numInput(st.value, st.min, st.max);

        try {
          let v = Number(inp.value);
          if (st.min !== undefined && v < st.min) v = st.min;
          if (st.max !== undefined && v > st.max) v = st.max;
          state.session.setCharacterStat(state.cid, st.key, v);
          markDirty(true);

          status('능력치를 변경했습니다.');
        } catch (e) {
          status('능력치 변경 중 오류가 발생했습니다.', true);
        }
      };
      inp.addEventListener('change', set);
      w.appendChild(inp);
      w.appendChild(el('span', String(st.min) + ' ~ ' + String(st.max), 'muted'));
      grid.appendChild(w);
    });
  }

  function skillLabel(s) {
    const cat = s.category ? '[' + codeLabel(Cat.skills, s.category) + '] ' : '';
    return cat + (s.name || s.id);
  }
  function renderSkillsTalents() {
    const sk = clear($('skills-box'));

    }
    const d = state.session.getCharacterDetail(state.cid);
    if (!d) return;
    (d.skills || []).forEach((s) => {
      const row = el('div', null, 'skill-row');
      row.appendChild(el('strong', skillLabel(s)));
      row.appendChild(el('span', s.isExpert ? '전문' : '일반', 'chip'));
      const learned = el('input'); learned.type = 'checkbox'; learned.checked = !!(s.currentExp > 0 || s.isExpert || s.clickedNodes);
      const expert = el('input'); expert.type = 'checkbox'; expert.checked = !!s.isExpert;
      const cur = numInput(s.currentExp || 0, 0, s.maxExp || undefined);
      const max = numInput(s.maxExp || 1, 0);
      row.appendChild(field('습득', learned));
      row.appendChild(field('전문', expert));
      row.appendChild(field('현재 숙련', cur));
      row.appendChild(field('최대 숙련', max));
      row.appendChild(button('저장', () => {
        try {
          state.session.setSkillMastery(state.cid, s.id, {
            learned: learned.checked,
            isExpert: expert.checked,
            currentExp: Number(cur.value),
            maxExp: Number(max.value)
          });
          markDirty(true);
          renderSkillsTalents();
          status('무공 숙련을 저장했습니다.');
        } catch (e) {
          status('무공 숙련 저장 중 오류가 발생했습니다.', true);
        }
      }));
      sk.appendChild(row);
    });
    if (!sk.childNodes.length) sk.appendChild(el('p', '무공 정보가 없습니다.', 'empty'));

    const talents = normalizeList(Cat.talents);
    const clicked = (d.clickedTalents || []).slice();
    const point = numInput(d.talentPoint, 0);
    ta.appendChild(field('남은 특성 점수', point));
    talents.forEach((t) => {
      const id = t.id !== undefined ? t.id : t.value;
      const cb = el('input'); cb.type = 'checkbox';
      cb.checked = clicked.indexOf(String(id)) >= 0 || clicked.indexOf(id) >= 0;
      const lab = el('label', null, 'talent-item');
      lab.appendChild(cb);
      lab.appendChild(el('span', t.name || t.label || id));
      ta.appendChild(lab);
    });
    ta.appendChild(button('특성 저장', () => {
      const nodes = [];
      ta.querySelectorAll('input[type=checkbox]').forEach((cb, i) => {
        if (cb.checked && talents[i]) nodes.push(talents[i].id !== undefined ? talents[i].id : talents[i].value);
      });
      try {
        state.session.setTalentNodes(state.cid, nodes, Number(point.value));
        markDirty(true);
        renderSkillsTalents();
        status('특성을 저장했습니다.');
      } catch (e) {
        status('특성 저장 중 오류가 발생했습니다.', true);
      }
    }, 'primary'));
  }

  function itemName(it) {
    if (!it) return '없음';
    if (typeof it === 'string' || typeof it === 'number') return String(it);
    if (it.ItemId) {
      const n = codeLabel(Cat.equipment, it.ItemId);
      if (n !== String(it.ItemId)) return n;
      const n2 = codeLabel(Cat.normalInventory, it.ItemId);
      if (n2 !== String(it.ItemId)) return n2;
      return String(it.ItemId);
    }
    return it.name || it.label || it.item || it.id || '없음';
  }
  function renderInventory() {
    const eq = clear($('equip-box'));
    const tb = clear($('inventory-toolbar'));
    const wr = clear($('inventory-table-wrap'));
    if (!eq || !tb || !wr) return;
    if (!state.session || state.cid === null) {
      wr.appendChild(el('p', '캐릭터를 선택해 주세요.', 'empty'));
      return;
    }
    const d = state.session.getCharacterDetail(state.cid);
    if (!d) return;
    const equipList = Array.isArray(d.equip)
      ? d.equip
      : Object.keys(d.equip || {}).map((slotKey) => ({
          slot: slotKey,
          label: codeLabel(Cat.equipSlots, slotKey),
          item: d.equip[slotKey]
        }));
    equipList.forEach((slot) => {
      const row = el('div', null, 'equip-row');
      row.appendChild(el('strong', slot.label || slot.slot));
      row.appendChild(el('span', itemName(slot.item)));
      row.appendChild(button('해제', () => {
        try {
          state.session.setEquipSlot(state.cid, slot.slot, null);
          markDirty(true);
          renderInventory();
          status('장비를 해제했습니다.');
        } catch (e) {
          status('장비 해제 중 오류가 발생했습니다.', true);
        }
      }));
      eq.appendChild(row);
    });
    if (!eq.childNodes.length) eq.appendChild(el('p', '장비 정보가 없습니다.', 'empty'));

    const invSel = selectInput(normalizeList(Cat.equipment).concat(normalizeList(Cat.normalInventory)), '', '아이템 선택');
    invSel.id = 'inventory-add-item';
    const addCount = numInput(1, 1);
    tb.appendChild(invSel);
    tb.appendChild(addCount);
    tb.appendChild(button('아이템 추가', () => {
      if (!invSel.value) { status('추가할 아이템을 선택해 주세요.', true); return; }
      try {
        state.session.addInventoryItem(state.cid, invSel.value, Number(addCount.value));
        markDirty(true);
        renderInventory();
        status('아이템을 추가했습니다.');
      } catch (e) {
        status('아이템 추가 중 오류가 발생했습니다.', true);
      }
    }, 'primary'));

    const table = el('table', null, 'inventory-table');
    const thead = el('thead');
    const hr = el('tr');
    ['번호', '이름', '코드', '수량', '내구도', '동작'].forEach((x) => hr.appendChild(el('th', x)));
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = el('tbody');
    (d.inventory || []).forEach((it, idx) => {
      if (!it) return;
      const itemIndex = it.index !== undefined ? it.index : idx;
      const itemId = it.ItemId || it.itemId || '';
      const countVal = it.Count !== undefined ? it.Count : (it.count !== undefined ? it.count : 1);
      const durVal = it.Durable !== undefined ? it.Durable : (it.durability || 0);
      const maxDurVal = it.MaxDurable !== undefined ? it.MaxDurable : (it.maxDurability || 0);
      const tr = el('tr');
      tr.appendChild(el('td', itemIndex));
      tr.appendChild(el('td', itemName(it)));
      tr.appendChild(el('td', itemId));
      const cnt = numInput(countVal, 0);
      const cntTd = el('td');
      cntTd.appendChild(cnt);
      tr.appendChild(cntTd);
      tr.appendChild(el('td', String(durVal) + ' / ' + String(maxDurVal)));
      const ops = el('td');
      ops.appendChild(button('저장', () => {
        try {
          state.session.setInventoryCount(state.cid, itemIndex, Number(cnt.value));
          markDirty(true);
          renderInventory();
          status('수량을 저장했습니다.');
        } catch (e) {
          status('수량 저장 중 오류가 발생했습니다.', true);
        }
      }));
      ops.appendChild(button('삭제', () => {
        try {
          state.session.removeInventoryItem(state.cid, itemIndex);
          markDirty(true);
          renderInventory();
          status('아이템을 삭제했습니다.');
        } catch (e) {
          status('아이템 삭제 중 오류가 발생했습니다.', true);
        }
      }));
      const eqSel = selectInput(equipList.map((x) => ({ id: x.slot, name: x.label || x.slot })), '', '장비 위치');
      ops.appendChild(eqSel);
      ops.appendChild(button('장착', () => {
        if (!eqSel.value) return;
        try {
          state.session.setEquipSlot(state.cid, eqSel.value, itemIndex);
          markDirty(true);
          renderInventory();
          status('장비를 장착했습니다.');
        } catch (e) {
          status('장비 장착 중 오류가 발생했습니다.', true);
        }
      }));
      tr.appendChild(ops);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wr.appendChild(table);
  }

  function renderParty() {
    const pb = clear($('party-box'));
    const tb = clear($('teleporters-box'));
    const nb = clear($('nicknames-box'));
    if (!pb || !tb || !nb) return;
    if (!state.session) {
      pb.appendChild(el('p', '열린 저장파일이 없습니다.', 'empty'));
      return;
    }
    const allChars = state.session.getCharacterList();
    const partyChars = allChars.filter((c) => c.isPlayer || c.isTeammate || c.inParty);
    const reserveChars = allChars.filter((c) => !c.isPlayer && !c.isTeammate && !c.inParty).slice(0, 120);
    const list = partyChars.concat(reserveChars);
    list.forEach((c) => {
      const isMate = !!(c.isTeammate || c.inParty);
      const row = el('div', null, 'party-row');
      row.appendChild(el('span', c.name || c.id));
      row.appendChild(el('span', isMate ? '동료' : '대기', 'chip'));
      if (c.isPlayer) {
        row.appendChild(el('span', '플레이어', 'chip'));
      } else {
        row.appendChild(button(isMate ? '해제' : '추가', () => {
          try {
            if (isMate) state.session.removeTeammate(c.id);
            else state.session.addTeammate(c.id);
            markDirty(true);
            renderParty();
            renderCharacters();
            status('동료 설정을 변경했습니다.');
          } catch (e) {
            status('동료 설정 변경 중 오류가 발생했습니다.', true);
          }
        }));
      }
      pb.appendChild(row);
    });
    if (!pb.childNodes.length) pb.appendChild(el('p', '동료 정보가 없습니다.', 'empty'));

    const gf = (state.session._gameFields ? state.session._gameFields() : state.session.gameFields) || {};
    const tel = Array.isArray(gf.AvailableTeleporters) ? gf.AvailableTeleporters : [];
    normalizeList(Cat.teleporters).forEach((t) => {
      const id = t.id !== undefined ? t.id : t.value;
      const row = el('label', null, 'check-row');
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = tel.indexOf(id) >= 0 || tel.indexOf(String(id)) >= 0;
      row.appendChild(cb);
      row.appendChild(el('span', t.name || t.label || id));
      tb.appendChild(row);
    });
    tb.appendChild(button('순간이동 해금 저장', () => {
      const values = [];
      tb.querySelectorAll('input[type=checkbox]').forEach((cb, i) => {
        const src = normalizeList(Cat.teleporters)[i];
        if (cb.checked && src) values.push(src.id !== undefined ? src.id : src.value);
      });
      try {
        state.session.setWorldSettings({
          difficulty: gf.Difficulty,
          daysFromBeginning: gf.DaysFromBeginning,
          skillExpRate: gf.SkillExpDistributionRate,
          unlockAllTeleporters: values.length === normalizeList(Cat.teleporters).length,
          unlockAllNicknames: !!(gf.AvailableNicknames && gf.AvailableNicknames.length)
        });
        markDirty(true);
        renderSummary();
        status('순간이동 설정을 저장했습니다.');
      } catch (e) {
        status('순간이동 설정 저장 중 오류가 발생했습니다.', true);
      }
    }, 'primary'));

    const nicks = Array.isArray(gf.AvailableNicknames) ? gf.AvailableNicknames : [];
    normalizeList(Cat.nicknames).forEach((n) => {
      const id = n.id !== undefined ? n.id : n.value;
      const row = el('label', null, 'check-row');
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = nicks.indexOf(id) >= 0 || nicks.indexOf(String(id)) >= 0;
      row.appendChild(cb);
      row.appendChild(el('span', n.name || n.label || id));
      nb.appendChild(row);
    });
    nb.appendChild(button('별명 해금 저장', () => {
      const values = [];
      nb.querySelectorAll('input[type=checkbox]').forEach((cb, i) => {
        const src = normalizeList(Cat.nicknames)[i];
        if (cb.checked && src) values.push(src.id !== undefined ? src.id : src.value);
      });
      try {
        state.session.setWorldSettings({
          difficulty: gf.Difficulty,
          daysFromBeginning: gf.DaysFromBeginning,
          skillExpRate: gf.SkillExpDistributionRate,
          unlockAllTeleporters: !!(gf.AvailableTeleporters && gf.AvailableTeleporters.length),
          unlockAllNicknames: values.length === normalizeList(Cat.nicknames).length
        });
        markDirty(true);
        renderSummary();
        status('별명 설정을 저장했습니다.');
      } catch (e) {
        status('별명 설정 저장 중 오류가 발생했습니다.', true);
      }
    }, 'primary'));
  }

  function renderAtlas() {
    const vb = clear($('validation-box'));
    const db = clear($('diff-box'));
    const ab = clear($('atlas-box'));
    if (!vb || !db || !ab) return;
    if (!state.session) {
      vb.appendChild(el('p', '열린 저장파일이 없습니다.', 'empty'));
      return;
    }
    try {
      const v = state.session.validate();
      vb.appendChild(el('strong', v.ok ? '검증 통과' : '검증 오류', v.ok ? 'ok' : 'bad'));
      (v.errors || []).forEach((x) => vb.appendChild(el('p', x, 'error-line')));
    } catch (e) {
      vb.appendChild(el('p', '검증 중 오류가 발생했습니다.', 'bad'));
    }
    try {
      const diff = state.session.computeDiff();
      const pre = el('pre', JSON.stringify(diff, (k, v) => (typeof v === 'bigint' ? v.toString() : v), 2));
      db.appendChild(pre);
    } catch (e) {
      db.appendChild(el('p', '차이 계산 중 오류가 발생했습니다.', 'bad'));
    }
    const atlas = Cat.codeAtlas;
    if (atlas) {
      if (Array.isArray(atlas)) {
        atlas.forEach((x) => {
          ab.appendChild(el('div', (x.name || x.label || x.id) + ' : ' + (x.value !== undefined ? x.value : x.id), 'atlas-line'));
        });
      } else {
        Object.keys(atlas).forEach((k) => {
          const v = atlas[k];
          ab.appendChild(el('div', k + ' : ' + (typeof v === 'object' ? JSON.stringify(v) : v), 'atlas-line'));
        });
      }
    } else {
      ab.appendChild(el('p', '코드 도감 정보가 없습니다.', 'empty'));
    }
  }

  function openPicker(title, list, onPick) {
    const dlg = $('picker-dialog');
    if (!dlg || !dlg.showModal) return;
    state.picker = { list: list || [], onPick };
    $('picker-title').textContent = title || '선택';
    $('picker-search').value = '';
    renderPicker();
    dlg.showModal();
    setTimeout(() => $('picker-search').focus(), 0);
  }
  function renderPicker() {
    const box = clear($('picker-list'));
    const q = ($('picker-search').value || '').toLowerCase();
    (state.picker ? state.picker.list : []).filter((x) => {
      const name = String(x.name || x.label || x.id || x.value || '');
      return !q || name.toLowerCase().includes(q);
    }).forEach((x) => {
      box.appendChild(button(x.name || x.label || x.id || x.value, () => {
        const fn = state.picker && state.picker.onPick;
        const dlg = $('picker-dialog');
        if (dlg && dlg.open) dlg.close();
        if (fn) fn(x);
      }, 'picker-item'));
    });
  }
  function setupPicker() {
    const dlg = $('picker-dialog');
    if (!dlg) return;
    $('picker-close').addEventListener('click', () => dlg.close());
    $('picker-search').addEventListener('input', renderPicker);
    dlg.addEventListener('cancel', () => { state.picker = null; });
  }

  function setupTheme() {
    const btn = $('btn-theme');
    function set(theme) {
      D.documentElement.dataset.theme = theme;
      D.body.dataset.theme = theme;
      if (btn) btn.textContent = theme === 'dark' ? '밝게' : '어둡게';
      try { localStorage.setItem('htls-theme', theme); } catch (e) {}
    }
    let saved = 'light';
    try { saved = localStorage.getItem('htls-theme') || 'light'; } catch (e) {}
    set(saved);
    if (btn) btn.addEventListener('click', () => set(D.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  }

  function setupBrowser() {
    const input = $('file-input');
    const open = $('btn-file-open');
    const save = $('btn-download-save');
    const demo = $('btn-load-demo');
    if (open && input) open.addEventListener('click', () => input.click());
    if (input) input.addEventListener('change', () => {
      const f = input.files && input.files[0];
      if (!f) return;
      f.arrayBuffer().then((buf) => openBytes(new Uint8Array(buf), f.name)).catch(() => status('파일 읽기 오류', true));
      input.value = '';
    });
    if (save) save.addEventListener('click', () => {
      const u8 = saveBytes();
      if (u8) { downloadU8(u8, state.fileName); status('저장파일을 내려받았습니다.'); }
    });
    if (demo) demo.addEventListener('click', () => {
      try {
        if (!Core || !Core.createDemoSave) throw 0;
        openBytes(Core.createDemoSave(), '예제.save');
        status('예제 저장파일을 열었습니다.');
      } catch (e) {
        status('예제 저장파일을 만들지 못했습니다.', true);
      }
    });
  }

  function setupNative() {
    const wv = window.chrome && window.chrome.webview;
    if (!wv) return;
    const bar = $('native-bar');
    if (bar) bar.hidden = false;
    window.__htlsBridgeReady = true;
    $('btn-native-open').addEventListener('click', () => wv.postMessage(JSON.stringify({ cmd: 'open' })));
    $('btn-native-save').addEventListener('click', () => {
      const u8 = saveBytes();
      if (u8) wv.postMessage(JSON.stringify({ cmd: 'save', path: state.nativePath || '', expectedHash: state.nativeSha256 || '', dataB64: u8ToB64(u8), fileName: state.fileName }));
    });
    $('btn-native-save-copy').addEventListener('click', () => {
      const u8 = saveBytes();
      if (u8) wv.postMessage(JSON.stringify({ cmd: 'saveAs', path: state.nativePath || '', dataB64: u8ToB64(u8), fileName: state.fileName }));
    });
    wv.addEventListener('message', (ev) => {
      let m = ev.data;
      if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { m = {}; } }
      m = m || {};
      try {
        if (m.canceled) return;
        if (m.error) { status('네이티브 오류: ' + m.error, true); return; }
        const b64 = m.dataB64 || m.data || m.base64 || m.content;
        if (b64) {
          state.nativePath = m.path || state.nativePath;
          state.nativeSha256 = m.sha256 || state.nativeSha256;
          openBytes(b64ToU8(b64), m.fileName || m.name || state.fileName);
        } else if (m.backupPath || m.saved || m.type === 'saved') {
          if (m.path) state.nativePath = m.path;
          if (m.sha256) state.nativeSha256 = m.sha256;
          markDirty(false);
          status('네이티브 저장 및 백업 완료');
        } else if (m.paths || m.type === 'discover' || m.type === 'ready') {
          status('네이티브 연결 준비됨');
        }
      } catch (e) {
        status('네이티브 메시지 처리 오류', true);
      }
    });
  }

  function setupServer() {
    fetch('/api/info').then((r) => r.ok ? r.json() : null).then((info) => {
      if (!info || !info.token) return;
      state.serverToken = info.token;
      const bar = $('server-bar');
      if (bar) bar.hidden = false;
      const sel = $('server-save-select');
      clear(sel);
      (info.files || info.saves || []).forEach((f) => sel.appendChild(opt(typeof f === 'string' ? f : (f.name || f.file), typeof f === 'string' ? f : (f.name || f.file))));
      $('btn-server-load').addEventListener('click', () => {
        const name = sel.value;
        if (!name) { status('불러올 저장파일을 선택해 주세요.', true); return; }
        fetch('/api/load?name=' + encodeURIComponent(name), { headers: { 'X-HTLS-Token': state.serverToken } })
          .then((r) => { if (!r.ok) throw 0; return r.arrayBuffer(); })
          .then((b) => { if (openBytes(new Uint8Array(b), name)) status('서버 저장파일을 열었습니다.'); })
          .catch(() => status('서버 불러오기 오류', true));
      });
      $('btn-server-save').addEventListener('click', () => {
        const u8 = saveBytes();
        if (!u8) return;
        fetch('/api/save', {
          method: 'POST',
          headers: { 'X-HTLS-Token': state.serverToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: state.fileName, data: u8ToB64(u8) })
        }).then((r) => {
          if (!r.ok) throw 0;
          status('서버에 저장했습니다.');
        }).catch(() => status('서버 저장 오류', true));
      });
    }).catch(() => {});
  }

  function setupHeaderButtons() {
    const theme = $('btn-theme');
    if (theme && !theme.dataset.bound) theme.dataset.bound = '1';
  }

  D.addEventListener('DOMContentLoaded', () => {
    setupTabs();
    setupTheme();
    setupBrowser();
    setupNative();
    setupServer();
    setupPicker();
    setupHeaderButtons();
    refreshAll();
    status('준비됨');
  });
})();
</script>
</body>
</html>
